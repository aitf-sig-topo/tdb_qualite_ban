server:
    bind:
        host: 0.0.0.0
        port: 5000
    url: http://aitf-ban.breizhpositive.bzh:5000
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    language: fr-FR
    cors: true
    pretty_print: true
    limit: 10
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'

logging:
    level: ERROR

metadata:
    identification:
        title: Service de tuiles vecteur - BAN Qualité
        description: Service OGC API pour l'exposition des indicateurs de qualité de la Base Adresse Nationale
        keywords:
            - adresse
            - BAN
            - qualité
            - tuiles vecteur
        keywords_type: theme
        terms_of_service: https://www.etalab.gouv.fr/licence-ouverte-open-licence
        url: http://aitf-ban.breizhpositive.bzh:5000
    license:
        name: Licence Ouverte / Open Licence
        url: https://www.etalab.gouv.fr/licence-ouverte-open-licence
    provider:
        name: Votre Organisation
        url: https://example.org
    contact:
        name: Contact
        email: contact@example.org

resources:
    bal-indicateurs:
        type: collection
        title: Indicateurs de qualité BAL
        description: Indicateurs de qualité des Bases Adresses Locales issus de la table ban_qualite.bal_indicateurs
        keywords:
            - adresses
            - qualité
            - BAL
        links:
            - type: text/html
              rel: canonical
              title: Information sur la BAN
              href: https://adresse.data.gouv.fr
              hreflang: fr-FR
        extents:
            spatial:
                bbox: [-5.5, 41.0, 10.0, 51.5]  # Approximation de la France métropolitaine
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
            temporal:
                begin: null
                end: null  # null signifie "maintenant"
        
        providers:
            # Provider pour les tuiles vecteur (MVT)
            - type: tile
              name: MVT-postgresql
              data:
                  host: localhost
                  port: 5432
                  dbname: ban
                  user: aitf_admin
                  password: vivelaterritoriale
                  search_path: [ban_qualite, public]
                  # Vous devrez adapter ces champs selon votre schéma de table
                  id_field: commune_insee
                  table: bal_indicateurs
                  geom_field: geom
                  storage_crs: http://www.opengis.net/def/crs/EPSG/0/2154
              options:
                  zoom:
                      min: 0
                      max: 16
                  schemes:
                      - WebMercatorQuad
              format:
                  name: pbf
                  mimetype: application/vnd.mapbox-vector-tile
            
            # Provider pour les features (optionnel, pour accès direct aux données)
            # - type: feature
